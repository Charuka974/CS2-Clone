<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TACTICAL OPS - Enhanced FPS</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cannon@0.6.2/build/cannon.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #00f2ff;
            --secondary: #ff2e63;
            --accent: #ffed4e;
            --dark: #0a0e27;
            --darker: #050814;
        }

        body {
            overflow: hidden;
            background: var(--darker);
            font-family: 'Rajdhani', sans-serif;
            color: white;
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* Scanline Effect */
        #gameCanvas::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 242, 255, 0.03) 0px,
                transparent 1px,
                transparent 2px,
                rgba(0, 242, 255, 0.03) 3px
            );
            pointer-events: none;
            z-index: 1;
        }

        /* Main Menu */
        #mainMenu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(0, 242, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, rgba(255, 46, 99, 0.1) 0%, transparent 50%),
                linear-gradient(135deg, var(--darker) 0%, var(--dark) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: menuFadeIn 0.8s ease;
        }

        @keyframes menuFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        #mainMenu h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 96px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 50%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 60px rgba(0, 242, 255, 0.4);
            margin-bottom: 20px;
            letter-spacing: 12px;
            animation: glowPulse 3s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { filter: drop-shadow(0 0 20px rgba(0, 242, 255, 0.6)); }
            50% { filter: drop-shadow(0 0 40px rgba(255, 46, 99, 0.8)); }
        }

        .menu-subtitle {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            color: var(--primary);
            letter-spacing: 8px;
            margin-bottom: 60px;
            opacity: 0.7;
            text-transform: uppercase;
        }

        .menu-button {
            position: relative;
            background: transparent;
            border: 2px solid var(--primary);
            padding: 20px 70px;
            margin: 15px;
            font-size: 22px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            color: var(--primary);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            letter-spacing: 4px;
            overflow: hidden;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }

        .menu-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            transition: left 0.5s;
        }

        .menu-button:hover {
            background: var(--primary);
            color: var(--dark);
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 0 30px var(--primary), inset 0 0 20px rgba(0, 242, 255, 0.3);
        }

        .menu-button:hover::before {
            left: 100%;
        }

        .menu-button:active {
            transform: translateY(0) scale(1.02);
        }

        /* HUD System */
        #hud {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            display: none;
            padding: 30px;
            z-index: 100;
            pointer-events: none;
        }

        .hud-container {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .hud-panel {
            background: linear-gradient(135deg, rgba(10, 14, 39, 0.85) 0%, rgba(5, 8, 20, 0.9) 100%);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 242, 255, 0.3);
            border-radius: 4px;
            padding: 20px 30px;
            position: relative;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(0, 242, 255, 0.05);
        }

        .hud-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
        }

        #healthBar {
            min-width: 250px;
        }

        .health-label {
            font-size: 11px;
            color: var(--primary);
            letter-spacing: 3px;
            font-weight: 700;
            margin-bottom: 8px;
            text-transform: uppercase;
            opacity: 0.8;
        }

        .health-display {
            display: flex;
            align-items: baseline;
            gap: 10px;
        }

        #healthText {
            font-family: 'Orbitron', sans-serif;
            font-size: 56px;
            font-weight: 900;
            color: var(--primary);
            line-height: 1;
            text-shadow: 0 0 20px rgba(0, 242, 255, 0.6);
            transition: color 0.3s;
        }

        .health-unit {
            font-size: 20px;
            color: var(--primary);
            opacity: 0.6;
        }

        .health-bar-bg {
            width: 200px;
            height: 6px;
            background: rgba(0, 242, 255, 0.1);
            border-radius: 3px;
            margin-top: 10px;
            overflow: hidden;
        }

        .health-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--secondary), var(--primary));
            transition: width 0.3s, background 0.3s;
            box-shadow: 0 0 10px var(--primary);
        }

        @keyframes danger-pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.05); color: var(--secondary); }
        }

        .low-health {
            animation: danger-pulse 0.6s infinite;
        }

        #ammoDisplay {
            text-align: right;
            min-width: 300px;
        }

        .weapon-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .ammo-container {
            display: flex;
            align-items: baseline;
            justify-content: flex-end;
            gap: 8px;
        }

        #currentAmmo {
            font-family: 'Orbitron', sans-serif;
            font-size: 56px;
            font-weight: 900;
            color: white;
            line-height: 1;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
        }

        #reserveAmmo {
            font-size: 24px;
            color: rgba(255, 255, 255, 0.5);
        }

        .ammo-bar-bg {
            width: 250px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin-top: 10px;
            overflow: hidden;
        }

        .ammo-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--primary));
            transition: width 0.3s;
            box-shadow: 0 0 10px var(--accent);
        }

        /* Crosshair */
        #crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            z-index: 50;
        }

        .crosshair-dot {
            width: 4px;
            height: 4px;
            background: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--primary);
        }

        .crosshair-line {
            position: absolute;
            background: var(--primary);
            box-shadow: 0 0 5px var(--primary);
        }

        .crosshair-line.top {
            width: 2px;
            height: 10px;
            top: -15px;
            left: 1px;
        }

        .crosshair-line.bottom {
            width: 2px;
            height: 10px;
            top: 9px;
            left: 1px;
        }

        .crosshair-line.left {
            width: 10px;
            height: 2px;
            top: 1px;
            left: -15px;
        }

        .crosshair-line.right {
            width: 10px;
            height: 2px;
            top: 1px;
            left: 9px;
        }

        /* Kill Feed */
        #killFeed {
            position: fixed;
            top: 30px;
            right: 30px;
            width: 400px;
            max-height: 400px;
            overflow: hidden;
            z-index: 90;
            display: none;
        }

        .kill-message {
            background: linear-gradient(90deg, rgba(0, 242, 255, 0.2), transparent);
            border-left: 3px solid var(--primary);
            padding: 12px 20px;
            margin-bottom: 10px;
            color: white;
            font-size: 16px;
            font-weight: 500;
            animation: killSlide 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(10px);
            letter-spacing: 1px;
        }

        @keyframes killSlide {
            from {
                transform: translateX(450px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .kill-icon {
            color: var(--secondary);
            margin: 0 8px;
            font-size: 18px;
        }

        /* Indicators */
        #reloadIndicator {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Orbitron', sans-serif;
            font-size: 36px;
            font-weight: 900;
            color: var(--accent);
            text-shadow: 0 0 20px var(--accent);
            display: none;
            z-index: 60;
            animation: pulse 0.8s ease-in-out infinite;
            letter-spacing: 4px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.6; transform: translate(-50%, -50%) scale(1.1); }
        }

        #hitmarker {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 40px;
            height: 40px;
            transform: translate(-50%, -50%);
            display: none;
            z-index: 70;
        }

        .hitmarker-line {
            position: absolute;
            width: 15px;
            height: 3px;
            background: white;
            box-shadow: 0 0 10px white;
        }

        .hitmarker-line.tl {
            top: 0;
            left: 0;
            transform: rotate(-45deg);
        }

        .hitmarker-line.tr {
            top: 0;
            right: 0;
            transform: rotate(45deg);
        }

        .hitmarker-line.bl {
            bottom: 0;
            left: 0;
            transform: rotate(45deg);
        }

        .hitmarker-line.br {
            bottom: 0;
            right: 0;
            transform: rotate(-45deg);
        }

        /* Minimap */
        #minimap {
            position: fixed;
            top: 30px;
            left: 30px;
            width: 200px;
            height: 200px;
            background: rgba(10, 14, 39, 0.8);
            border: 2px solid var(--primary);
            border-radius: 4px;
            display: none;
            z-index: 90;
            overflow: hidden;
        }

        #minimapCanvas {
            width: 100%;
            height: 100%;
        }

        /* Death Screen */
        #deathScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255, 46, 99, 0.4) 0%, rgba(0, 0, 0, 0.9) 70%);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 150;
            animation: deathFade 0.5s ease;
        }

        @keyframes deathFade {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        #deathScreen h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 96px;
            font-weight: 900;
            color: var(--secondary);
            text-shadow: 0 0 40px var(--secondary);
            margin-bottom: 20px;
            animation: deathPulse 1s ease-in-out infinite;
        }

        @keyframes deathPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .death-stats {
            font-size: 24px;
            color: white;
            opacity: 0.8;
            letter-spacing: 2px;
        }

        /* Score Display */
        #scoreDisplay {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            z-index: 90;
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
            text-shadow: 0 0 10px var(--primary);
            letter-spacing: 2px;
        }

        .score-divider {
            color: var(--accent);
            margin: 0 15px;
        }

        /* Loading Screen */
        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--darker);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            flex-direction: column;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(0, 242, 255, 0.2);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 30px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #loadingScreen h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            color: var(--primary);
            letter-spacing: 4px;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <!-- Main Menu -->
    <div id="mainMenu">
        <h1>TACTICAL OPS</h1>
        <div class="menu-subtitle">Elite Combat Simulator</div>
        <button class="menu-button" onclick="startGame('singleplayer')">
            <i class="fas fa-crosshairs"></i> COMBAT TRAINING
        </button>
        <button class="menu-button" onclick="startGame('deathmatch')">
            <i class="fas fa-skull"></i> DEATHMATCH
        </button>
    </div>

    <!-- HUD -->
    <div id="hud">
        <div class="hud-container">
            <div class="hud-panel" id="healthBar">
                <div class="health-label">VITALS</div>
                <div class="health-display">
                    <span id="healthText">100</span>
                    <span class="health-unit">HP</span>
                </div>
                <div class="health-bar-bg">
                    <div class="health-bar-fill" id="healthBarFill" style="width: 100%"></div>
                </div>
            </div>

            <div class="hud-panel" id="ammoDisplay">
                <div class="weapon-name" id="weaponName">M4A1-S</div>
                <div class="ammo-container">
                    <span id="currentAmmo">30</span>
                    <span id="reserveAmmo">/ 90</span>
                </div>
                <div class="ammo-bar-bg">
                    <div class="ammo-bar-fill" id="ammoBarFill" style="width: 100%"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Crosshair -->
    <div id="crosshair">
        <div class="crosshair-dot"></div>
        <div class="crosshair-line top"></div>
        <div class="crosshair-line bottom"></div>
        <div class="crosshair-line left"></div>
        <div class="crosshair-line right"></div>
    </div>

    <!-- Hitmarker -->
    <div id="hitmarker">
        <div class="hitmarker-line tl"></div>
        <div class="hitmarker-line tr"></div>
        <div class="hitmarker-line bl"></div>
        <div class="hitmarker-line br"></div>
    </div>

    <!-- Kill Feed -->
    <div id="killFeed"></div>

    <!-- Score Display -->
    <div id="scoreDisplay">
        <span id="killCount">0</span>
        <span class="score-divider">|</span>
        <span id="deathCount">0</span>
    </div>

    <!-- Minimap -->
    <div id="minimap">
        <canvas id="minimapCanvas" width="200" height="200"></canvas>
    </div>

    <!-- Reload Indicator -->
    <div id="reloadIndicator">RELOADING</div>

    <!-- Loading Screen -->
    <div id="loadingScreen">
        <div class="loading-spinner"></div>
        <h2>INITIALIZING...</h2>
    </div>

    <!-- Death Screen -->
    <div id="deathScreen">
        <h2>ELIMINATED</h2>
        <div class="death-stats">Respawning...</div>
    </div>

    <script>
        // ============================================================================
        // GLOBAL GAME STATE
        // ============================================================================
        
        let scene, camera, renderer, world;
        let playerBody;
        let currentWeapon = 'rifle';
        let rifleModel, pistolModel;
        let gameMode = null;
        let isPointerLocked = false;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let isSprinting = false, isCrouching = false;
        let canJump = true;
        let playerHealth = 100;
        let rifleAmmo = 30, rifleReserve = 90;
        let pistolAmmo = 17, pistolReserve = 51;
        let isReloading = false;
        let bots = [];
        let bobTimer = 0;
        let mouseX = 0, mouseY = 0;
        let kills = 0, deaths = 0;
        let particles = [];
        let muzzleFlashes = [];
        let bulletTracers = [];

        const BOB_SPEED = 12;
        const BOB_AMOUNT = 0.02;
        const PLAYER_HEIGHT = 1.8;
        const CROUCH_HEIGHT = 1.2;
        const MOVE_SPEED = 20;
        const SPRINT_SPEED = 30;
        const CROUCH_SPEED = 8;
        const JUMP_FORCE = 7;
        const rotationSpeed = 0.002;

        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();

        // ============================================================================
        // BOT AI CLASS (Define before using)
        // ============================================================================

        class Bot {
            constructor(id, spawnPosition) {
                this.id = id;
                this.health = 100;
                this.position = spawnPosition || new THREE.Vector3(
                    (Math.random() - 0.5) * 150,
                    2,
                    (Math.random() - 0.5) * 150
                );

                // Create bot mesh with better materials
                const geometry = new THREE.BoxGeometry(0.8, PLAYER_HEIGHT, 0.8);
                const bodyMaterial = new THREE.MeshStandardMaterial({ 
                    color: 0xff3333,
                    metalness: 0.3,
                    roughness: 0.7,
                    emissive: 0xff0000,
                    emissiveIntensity: 0.2
                });
                this.mesh = new THREE.Mesh(geometry, bodyMaterial);
                this.mesh.position.copy(this.position);
                this.mesh.castShadow = true;
                this.mesh.receiveShadow = true;
                scene.add(this.mesh);

                // Add head
                const headGeom = new THREE.BoxGeometry(0.5, 0.5, 0.5);
                const headMaterial = new THREE.MeshStandardMaterial({ 
                    color: 0xff6666,
                    emissive: 0xff0000,
                    emissiveIntensity: 0.1
                });
                this.head = new THREE.Mesh(headGeom, headMaterial);
                this.head.position.y = PLAYER_HEIGHT / 2 + 0.4;
                this.mesh.add(this.head);

                // Physics body
                const shape = new CANNON.Box(new CANNON.Vec3(0.4, PLAYER_HEIGHT/2, 0.4));
                this.body = new CANNON.Body({
                    mass: 80,
                    position: new CANNON.Vec3(this.position.x, this.position.y, this.position.z),
                    shape: shape,
                    linearDamping: 0.9
                });
                world.addBody(this.body);

                this.lastShootTime = 0;
                this.shootInterval = 1500 + Math.random() * 1500;
                this.state = 'patrol';
                this.targetPosition = this.getRandomPatrolPoint();
                this.stateTimer = 0;
                this.detectionRange = 50;
                this.shootingAccuracy = 0.7;
                this.alive = true;
            }

            getRandomPatrolPoint() {
                return new THREE.Vector3(
                    (Math.random() - 0.5) * 140,
                    2,
                    (Math.random() - 0.5) * 140
                );
            }

            update(deltaTime) {
                if (!this.alive || this.health <= 0) return;

                this.stateTimer += deltaTime;

                const playerPos = new THREE.Vector3(
                    playerBody.position.x,
                    playerBody.position.y,
                    playerBody.position.z
                );
                const botPos = new THREE.Vector3(
                    this.body.position.x,
                    this.body.position.y,
                    this.body.position.z
                );
                const distanceToPlayer = botPos.distanceTo(playerPos);

                // State machine
                if (distanceToPlayer < this.detectionRange) {
                    this.state = 'combat';
                } else if (this.state === 'combat' && distanceToPlayer > this.detectionRange + 20) {
                    this.state = 'patrol';
                    this.targetPosition = this.getRandomPatrolPoint();
                }

                // Execute state behavior
                if (this.state === 'patrol') {
                    this.patrol(deltaTime);
                } else if (this.state === 'combat') {
                    this.combat(deltaTime, playerPos, botPos);
                }

                // Sync mesh with physics
                this.mesh.position.copy(this.body.position);

                // Look at movement direction
                if (this.body.velocity.length() > 0.1) {
                    const angle = Math.atan2(this.body.velocity.x, this.body.velocity.z);
                    this.mesh.rotation.y = angle;
                }
            }

            patrol(deltaTime) {
                const botPos = new THREE.Vector3(
                    this.body.position.x,
                    this.body.position.y,
                    this.body.position.z
                );

                const distanceToTarget = botPos.distanceTo(this.targetPosition);

                if (distanceToTarget < 2 || this.stateTimer > 5) {
                    this.targetPosition = this.getRandomPatrolPoint();
                    this.stateTimer = 0;
                }

                const direction = new CANNON.Vec3(
                    this.targetPosition.x - this.body.position.x,
                    0,
                    this.targetPosition.z - this.body.position.z
                );
                direction.normalize();

                const speed = 3;
                this.body.velocity.x = direction.x * speed;
                this.body.velocity.z = direction.z * speed;
            }

            combat(deltaTime, playerPos, botPos) {
                // Move toward player with strafing
                const direction = new CANNON.Vec3(
                    playerPos.x - botPos.x,
                    0,
                    playerPos.z - botPos.z
                );
                const distance = Math.sqrt(direction.x * direction.x + direction.z * direction.z);
                direction.normalize();

                // Strafe if too close
                let speed = 4;
                if (distance < 15) {
                    // Strafe perpendicular
                    const strafeDir = new CANNON.Vec3(-direction.z, 0, direction.x);
                    this.body.velocity.x = strafeDir.x * speed + direction.x * -2;
                    this.body.velocity.z = strafeDir.z * speed + direction.z * -2;
                } else if (distance > 30) {
                    // Move closer
                    this.body.velocity.x = direction.x * speed;
                    this.body.velocity.z = direction.z * speed;
                } else {
                    // Optimal range - minimal movement
                    this.body.velocity.x *= 0.8;
                    this.body.velocity.z *= 0.8;
                }

                // Look at player
                const angle = Math.atan2(direction.x, direction.z);
                this.mesh.rotation.y = angle;

                // Shoot at player
                const now = Date.now();
                if (now - this.lastShootTime > this.shootInterval && distance < 40) {
                    this.shoot(playerPos);
                    this.lastShootTime = now;
                }
            }

            shoot(targetPos) {
                const origin = new THREE.Vector3(
                    this.body.position.x,
                    this.body.position.y + 1,
                    this.body.position.z
                );

                // Add inaccuracy based on accuracy stat
                const inaccuracy = (1 - this.shootingAccuracy) * 2;
                const targetWithSpread = new THREE.Vector3(
                    targetPos.x + (Math.random() - 0.5) * inaccuracy,
                    targetPos.y + (Math.random() - 0.5) * inaccuracy,
                    targetPos.z + (Math.random() - 0.5) * inaccuracy
                );

                const direction = targetWithSpread.clone().sub(origin).normalize();

                // Create bullet tracer
                createBulletTracer(origin, direction, 50);

                // Muzzle flash
                createMuzzleFlash(origin, 0.2);

                // Raycast to check hit
                const raycaster = new THREE.Raycaster(origin, direction, 0, 100);
                const intersects = raycaster.intersectObjects(scene.children, true);

                if (intersects.length > 0) {
                    const hit = intersects[0];
                    createImpactEffect(hit.point);

                    // Check if hit player
                    const distToPlayer = origin.distanceTo(new THREE.Vector3(
                        playerBody.position.x,
                        playerBody.position.y + 1,
                        playerBody.position.z
                    ));

                    if (distToPlayer < 2) {
                        const damage = 15 + Math.random() * 10;
                        damagePlayer(damage);
                    }
                }
            }

            takeDamage(amount) {
                this.health -= amount;
                
                // Flash red
                this.mesh.material.emissiveIntensity = 1;
                setTimeout(() => {
                    if (this.alive) {
                        this.mesh.material.emissiveIntensity = 0.2;
                    }
                }, 100);

                if (this.health <= 0) {
                    this.die();
                }
            }

            die() {
                this.alive = false;
                
                // Death animation
                const deathDuration = 1000;
                const startTime = Date.now();
                
                const animateDeath = () => {
                    const elapsed = Date.now() - startTime;
                    const progress = elapsed / deathDuration;
                    
                    if (progress < 1) {
                        this.mesh.rotation.x = progress * Math.PI / 2;
                        this.mesh.position.y = this.body.position.y - progress * 0.5;
                        requestAnimationFrame(animateDeath);
                    } else {
                        scene.remove(this.mesh);
                        world.removeBody(this.body);
                        
                        // Remove from bots array
                        const index = bots.indexOf(this);
                        if (index > -1) {
                            bots.splice(index, 1);
                        }
                        
                        // Respawn bot after delay
                        setTimeout(() => {
                            const newBot = new Bot(this.id);
                            bots.push(newBot);
                        }, 5000);
                    }
                };
                
                animateDeath();
                
                kills++;
                updateScore();
                addKillFeedMessage('You', `Enemy ${this.id}`);
            }
        }

        // ============================================================================
        // MAP GENERATION
        // ============================================================================

        function createMap() {
            const groundMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xD2B48C,
                roughness: 0.9,
                metalness: 0.0
            });
            
            const wallMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xA0826D,
                roughness: 0.8,
                metalness: 0.1
            });

            const boxMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x8B7355,
                roughness: 0.7,
                metalness: 0.2
            });

            // Ground with texture-like appearance
            const groundGeom = new THREE.BoxGeometry(200, 1, 200);
            const ground = new THREE.Mesh(groundGeom, groundMaterial);
            ground.position.y = -0.5;
            ground.receiveShadow = true;
            scene.add(ground);

            const groundShape = new CANNON.Box(new CANNON.Vec3(100, 0.5, 100));
            const groundBody = new CANNON.Body({ mass: 0 });
            groundBody.addShape(groundShape);
            groundBody.position.y = -0.5;
            world.addBody(groundBody);

            function createBox(x, y, z, w, h, d, mat) {
                const geom = new THREE.BoxGeometry(w, h, d);
                const mesh = new THREE.Mesh(geom, mat);
                mesh.position.set(x, y, z);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                scene.add(mesh);

                const shape = new CANNON.Box(new CANNON.Vec3(w/2, h/2, d/2));
                const body = new CANNON.Body({ mass: 0 });
                body.addShape(shape);
                body.position.set(x, y, z);
                world.addBody(body);

                return mesh;
            }

            // Outer walls
            createBox(0, 5, -100, 200, 10, 2, wallMaterial);
            createBox(0, 5, 100, 200, 10, 2, wallMaterial);
            createBox(-100, 5, 0, 2, 10, 200, wallMaterial);
            createBox(100, 5, 0, 2, 10, 200, wallMaterial);

            // Site A
            createBox(-60, 3, -60, 30, 6, 30, boxMaterial);
            createBox(-40, 1.5, -40, 10, 3, 10, boxMaterial);
            createBox(-70, 2, -40, 8, 4, 8, boxMaterial);

            // Site B
            createBox(60, 3, 60, 30, 6, 30, boxMaterial);
            createBox(40, 1.5, 40, 10, 3, 10, boxMaterial);
            createBox(70, 2, 40, 8, 4, 8, boxMaterial);

            // Mid
            createBox(0, 4, 0, 4, 8, 40, wallMaterial);
            createBox(-20, 2, 20, 15, 4, 15, boxMaterial);
            createBox(20, 2, -20, 15, 4, 15, boxMaterial);

            // Cover
            const coverPositions = [
                [-30, 10], [30, -10], [-10, 30], [10, -30],
                [-50, 20], [50, -20], [0, 40], [0, -40],
                [-45, -30], [45, 30], [-25, -50], [25, 50]
            ];

            coverPositions.forEach(([x, z]) => {
                const height = Math.random() * 2 + 1;
                createBox(x, height, z, 4, height * 2, 4, boxMaterial);
            });
        }

        // ============================================================================
        // PARTICLE SYSTEM
        // ============================================================================

        function createMuzzleFlash(position, size = 0.3) {
            const geometry = new THREE.SphereGeometry(size, 8, 8);
            const material = new THREE.MeshBasicMaterial({ 
                color: 0xffff00,
                transparent: true,
                opacity: 1
            });
            const flash = new THREE.Mesh(geometry, material);
            flash.position.copy(position);
            scene.add(flash);

            muzzleFlashes.push({ mesh: flash, life: 0.05 });

            // Add point light
            const light = new THREE.PointLight(0xffaa00, 2, 10);
            light.position.copy(position);
            scene.add(light);

            setTimeout(() => {
                scene.remove(light);
            }, 50);
        }

        function createBulletTracer(origin, direction, length) {
            const end = origin.clone().add(direction.clone().multiplyScalar(length));
            
            const geometry = new THREE.BufferGeometry().setFromPoints([origin, end]);
            const material = new THREE.LineBasicMaterial({ 
                color: 0xffaa00,
                transparent: true,
                opacity: 0.8
            });
            const line = new THREE.Line(geometry, material);
            scene.add(line);

            bulletTracers.push({ mesh: line, life: 0.1 });
        }

        function createImpactEffect(position) {
            // Sparks
            for (let i = 0; i < 8; i++) {
                const geometry = new THREE.SphereGeometry(0.03);
                const material = new THREE.MeshBasicMaterial({ 
                    color: 0xff6633,
                    transparent: true,
                    opacity: 1
                });
                const spark = new THREE.Mesh(geometry, material);
                spark.position.copy(position);
                scene.add(spark);

                const velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 3,
                    Math.random() * 3,
                    (Math.random() - 0.5) * 3
                );

                particles.push({
                    mesh: spark,
                    velocity: velocity,
                    life: 0.5,
                    gravity: -15
                });
            }

            // Dust cloud
            for (let i = 0; i < 5; i++) {
                const geometry = new THREE.SphereGeometry(0.1);
                const material = new THREE.MeshBasicMaterial({ 
                    color: 0x999999,
                    transparent: true,
                    opacity: 0.5
                });
                const dust = new THREE.Mesh(geometry, material);
                dust.position.copy(position);
                scene.add(dust);

                const velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.5,
                    Math.random() * 0.5,
                    (Math.random() - 0.5) * 0.5
                );

                particles.push({
                    mesh: dust,
                    velocity: velocity,
                    life: 0.8,
                    gravity: -2
                });
            }
        }

        function updateParticles(deltaTime) {
            // Update particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const particle = particles[i];
                particle.life -= deltaTime;

                if (particle.life <= 0) {
                    scene.remove(particle.mesh);
                    particles.splice(i, 1);
                    continue;
                }

                particle.velocity.y += particle.gravity * deltaTime;
                particle.mesh.position.add(particle.velocity.clone().multiplyScalar(deltaTime));
                particle.mesh.material.opacity = particle.life / 0.5;
            }

            // Update muzzle flashes
            for (let i = muzzleFlashes.length - 1; i >= 0; i--) {
                const flash = muzzleFlashes[i];
                flash.life -= deltaTime;

                if (flash.life <= 0) {
                    scene.remove(flash.mesh);
                    muzzleFlashes.splice(i, 1);
                }
            }

            // Update bullet tracers
            for (let i = bulletTracers.length - 1; i >= 0; i--) {
                const tracer = bulletTracers[i];
                tracer.life -= deltaTime;

                if (tracer.life <= 0) {
                    scene.remove(tracer.mesh);
                    bulletTracers.splice(i, 1);
                }
            }
        }

        function initControls() {
            document.addEventListener('keydown', (e) => {
                switch(e.code) {
                    case 'KeyW': moveForward = true; break;
                    case 'KeyS': moveBackward = true; break;
                    case 'KeyA': moveLeft = true; break;
                    case 'KeyD': moveRight = true; break;
                    case 'ShiftLeft': isSprinting = true; break;
                    case 'KeyC': 
                        isCrouching = !isCrouching;
                        updateCameraHeight();
                        break;
                    case 'Space':
                        if (canJump) {
                            playerBody.velocity.y = JUMP_FORCE;
                            canJump = false;
                        }
                        break;
                    case 'KeyR':
                        reload();
                        break;
                    case 'Digit1':
                        switchWeapon('rifle');
                        break;
                    case 'Digit2':
                        switchWeapon('pistol');
                        break;
                }
            });

            document.addEventListener('keyup', (e) => {
                switch(e.code) {
                    case 'KeyW': moveForward = false; break;
                    case 'KeyS': moveBackward = false; break;
                    case 'KeyA': moveLeft = false; break;
                    case 'KeyD': moveRight = false; break;
                    case 'ShiftLeft': isSprinting = false; break;
                }
            });

            document.addEventListener('click', () => {
                if (!isPointerLocked) {
                    renderer.domElement.requestPointerLock();
                }
            });

            document.addEventListener('pointerlockchange', () => {
                isPointerLocked = document.pointerLockElement === renderer.domElement;
            });

            document.addEventListener('mousemove', (e) => {
                if (!isPointerLocked) return;

                mouseX -= e.movementX * rotationSpeed;
                mouseY -= e.movementY * rotationSpeed;
                mouseY = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, mouseY));
            });

            document.addEventListener('mousedown', (e) => {
                if (!isPointerLocked) return;

                if (e.button === 0) {
                    shoot();
                }
            });

            document.addEventListener('contextmenu', (e) => e.preventDefault());
        }

        function updateCameraHeight() {
            const targetHeight = isCrouching ? CROUCH_HEIGHT : PLAYER_HEIGHT;
            camera.position.y = playerBody.position.y + targetHeight - PLAYER_HEIGHT/2;
        }

        // ============================================================================
        // COMBAT SYSTEM
        // ============================================================================

        function shoot() {
            if (isReloading) return;

            const currentAmmo = currentWeapon === 'rifle' ? rifleAmmo : pistolAmmo;
            if (currentAmmo <= 0) {
                return;
            }

            if (currentWeapon === 'rifle') {
                rifleAmmo--;
            } else {
                pistolAmmo--;
            }
            updateHUD();

            const muzzlePos = new THREE.Vector3();
            camera.getWorldPosition(muzzlePos);
            const direction = camera.getWorldDirection(new THREE.Vector3());
            muzzlePos.add(direction.multiplyScalar(0.5));
            
            createMuzzleFlash(muzzlePos);
            
            // Create bullet tracer
            createBulletTracer(muzzlePos.clone(), camera.getWorldDirection(new THREE.Vector3()), 100);

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(scene.children, true);

            if (intersects.length > 0) {
                const hit = intersects[0];
                createImpactEffect(hit.point);

                // Check if hit a bot
                let hitBot = false;
                bots.forEach(bot => {
                    if (bot.mesh === hit.object || bot.head === hit.object || hit.object.parent === bot.mesh) {
                        const isHeadshot = bot.head === hit.object;
                        const damage = isHeadshot ? 100 : 25;
                        bot.takeDamage(damage);
                        showHitmarker();
                        hitBot = true;
                    }
                });
            }

            // Recoil
            const recoilAmount = currentWeapon === 'rifle' ? 0.015 : 0.02;
            mouseY += recoilAmount;
            mouseX += (Math.random() - 0.5) * recoilAmount * 0.5;
        }

        function showHitmarker() {
            const hitmarker = document.getElementById('hitmarker');
            hitmarker.style.display = 'block';
            setTimeout(() => {
                hitmarker.style.display = 'none';
            }, 100);
        }

        function reload() {
            if (isReloading) return;

            const reserve = currentWeapon === 'rifle' ? rifleReserve : pistolReserve;
            const maxAmmo = currentWeapon === 'rifle' ? 30 : 17;
            const currentAmmo = currentWeapon === 'rifle' ? rifleAmmo : pistolAmmo;

            if (reserve <= 0 || currentAmmo === maxAmmo) return;

            isReloading = true;
            document.getElementById('reloadIndicator').style.display = 'block';

            setTimeout(() => {
                const needed = maxAmmo - currentAmmo;
                const toReload = Math.min(needed, reserve);

                if (currentWeapon === 'rifle') {
                    rifleAmmo += toReload;
                    rifleReserve -= toReload;
                } else {
                    pistolAmmo += toReload;
                    pistolReserve -= toReload;
                }

                isReloading = false;
                document.getElementById('reloadIndicator').style.display = 'none';
                updateHUD();
            }, 2000);
        }

        function switchWeapon(weapon) {
            if (weapon === currentWeapon) return;
            
            currentWeapon = weapon;

            if (currentWeapon === 'rifle') {
                pistolModel.visible = false;
                rifleModel.visible = true;
            } else {
                rifleModel.visible = false;
                pistolModel.visible = true;
            }

            updateHUD();
        }

        function damagePlayer(amount) {
            playerHealth = Math.max(0, playerHealth - amount);
            updateHUD();

            // Screen flash
            const flash = document.createElement('div');
            flash.style.position = 'fixed';
            flash.style.top = '0';
            flash.style.left = '0';
            flash.style.width = '100%';
            flash.style.height = '100%';
            flash.style.background = 'radial-gradient(circle, transparent 30%, rgba(255, 0, 0, 0.3) 100%)';
            flash.style.pointerEvents = 'none';
            flash.style.zIndex = '200';
            document.body.appendChild(flash);
            setTimeout(() => flash.remove(), 200);

            if (playerHealth <= 0) {
                die();
            }
        }

        function die() {
            document.getElementById('deathScreen').style.display = 'flex';
            isPointerLocked = false;
            document.exitPointerLock();
            deaths++;
            updateScore();

            setTimeout(() => {
                playerHealth = 100;
                playerBody.position.set(0, 10, 0);
                playerBody.velocity.set(0, 0, 0);
                rifleAmmo = 30;
                rifleReserve = 90;
                pistolAmmo = 17;
                pistolReserve = 51;
                document.getElementById('deathScreen').style.display = 'none';
                updateHUD();
            }, 3000);
        }

        // ============================================================================
        // UI FUNCTIONS
        // ============================================================================

        function updateHUD() {
            const healthEl = document.getElementById('healthText');
            healthEl.textContent = playerHealth;
            
            const healthBar = document.getElementById('healthBarFill');
            healthBar.style.width = playerHealth + '%';

            if (playerHealth < 30) {
                healthEl.classList.add('low-health');
                healthBar.style.background = 'linear-gradient(90deg, #ff0000, #ff3333)';
            } else if (playerHealth < 60) {
                healthEl.classList.remove('low-health');
                healthBar.style.background = 'linear-gradient(90deg, #ffaa00, #ffcc00)';
            } else {
                healthEl.classList.remove('low-health');
                healthBar.style.background = 'linear-gradient(90deg, var(--secondary), var(--primary))';
            }

            const currentAmmo = currentWeapon === 'rifle' ? rifleAmmo : pistolAmmo;
            const reserve = currentWeapon === 'rifle' ? rifleReserve : pistolReserve;
            const maxAmmo = currentWeapon === 'rifle' ? 30 : 17;

            document.getElementById('currentAmmo').textContent = currentAmmo;
            document.getElementById('reserveAmmo').textContent = `/ ${reserve}`;

            const ammoBar = document.getElementById('ammoBarFill');
            ammoBar.style.width = (currentAmmo / maxAmmo * 100) + '%';

            const nameEl = document.getElementById('weaponName');
            if (currentWeapon === 'rifle') {
                nameEl.textContent = "M4A1-S";
            } else {
                nameEl.textContent = "GLOCK-18";
            }
        }

        function updateScore() {
            document.getElementById('killCount').textContent = kills;
            document.getElementById('deathCount').textContent = deaths;
        }

        function addKillFeedMessage(killer, victim) {
            const killFeed = document.getElementById('killFeed');
            const message = document.createElement('div');
            message.className = 'kill-message';
            message.innerHTML = `${killer} <span class="kill-icon">☠</span> ${victim}`;
            killFeed.insertBefore(message, killFeed.firstChild);

            setTimeout(() => message.remove(), 5000);

            while (killFeed.children.length > 5) {
                killFeed.removeChild(killFeed.lastChild);
            }
        }

        function spawnBots(count) {
            const spawnPoints = [
                new THREE.Vector3(-70, 2, -70),
                new THREE.Vector3(70, 2, 70),
                new THREE.Vector3(-70, 2, 70),
                new THREE.Vector3(70, 2, -70),
                new THREE.Vector3(0, 2, 80),
                new THREE.Vector3(0, 2, -80),
                new THREE.Vector3(-80, 2, 0),
                new THREE.Vector3(80, 2, 0)
            ];

            for (let i = 0; i < count; i++) {
                const spawnPos = spawnPoints[i % spawnPoints.length];
                const bot = new Bot(i + 1, spawnPos);
                bots.push(bot);
            }
        }

        // ============================================================================
        // GAME LOOP
        // ============================================================================

        let lastTime = performance.now();

        function gameLoop() {
            requestAnimationFrame(gameLoop);

            const currentTime = performance.now();
            const deltaTime = (currentTime - lastTime) / 1000;
            lastTime = currentTime;

            world.step(1/60, deltaTime, 3);

            if (isPointerLocked) {
                let speed = moveForward || moveBackward || moveLeft || moveRight ? 
                            (isSprinting ? SPRINT_SPEED : (isCrouching ? CROUCH_SPEED : MOVE_SPEED)) : 0;

                const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
                forward.y = 0;
                right.y = 0;
                forward.normalize();
                right.normalize();

                let moveVec = new THREE.Vector3(0, 0, 0);
                if (moveForward) moveVec.add(forward);
                if (moveBackward) moveVec.sub(forward);
                if (moveRight) moveVec.add(right);
                if (moveLeft) moveVec.sub(right);

                if (moveVec.length() > 0) {
                    moveVec.normalize().multiplyScalar(speed);
                    
                    playerBody.velocity.x = moveVec.x;
                    playerBody.velocity.z = moveVec.z;

                    bobTimer += deltaTime * (isSprinting ? BOB_SPEED * 1.5 : BOB_SPEED);
                    const bobY = Math.sin(bobTimer) * BOB_AMOUNT;
                    const bobX = Math.cos(bobTimer * 0.5) * (BOB_AMOUNT * 0.5);
                    
                    camera.position.y += bobY;
                    camera.position.x += bobX;
                    camera.rotation.z = Math.sin(bobTimer * 0.5) * 0.015;
                } else {
                    playerBody.velocity.x *= 0.1;
                    playerBody.velocity.z *= 0.1;
                    bobTimer = 0;
                    camera.rotation.z *= 0.9;
                }

                camera.position.x = playerBody.position.x;
                camera.position.z = playerBody.position.z;
                
                if (Math.abs(playerBody.velocity.y) < 0.1) {
                    canJump = true;
                }

                updateCameraHeight();
                camera.rotation.order = 'YXZ';
                camera.rotation.y = mouseX;
                camera.rotation.x = mouseY;
            }

            // Update bots
            bots.forEach(bot => bot.update(deltaTime));

            // Update particles
            updateParticles(deltaTime);

            renderer.render(scene, camera);
        }

        // ============================================================================
        // GAME START
        // ============================================================================

        function startGame(mode) {
            gameMode = mode;
            document.getElementById('mainMenu').style.display = 'none';
            document.getElementById('loadingScreen').style.display = 'flex';

            setTimeout(() => {
                initThreeJS();
                initPhysics();
                createMap();

                rifleModel = createRifleModel();
                pistolModel = createPistolModel();
                pistolModel.visible = false;

                camera.add(rifleModel);
                camera.add(pistolModel);

                initControls();

                const botCount = mode === 'singleplayer' ? 5 : 8;
                spawnBots(botCount);

                document.getElementById('loadingScreen').style.display = 'none';
                document.getElementById('hud').style.display = 'block';
                document.getElementById('crosshair').style.display = 'block';
                document.getElementById('killFeed').style.display = 'block';
                document.getElementById('scoreDisplay').style.display = 'block';
                document.getElementById('minimap').style.display = 'block';
                
                updateHUD();
                updateScore();
                gameLoop();
            }, 1500);
        }
    </script>
</body>
